name: CI

on:
  push:
  pull_request:

jobs:
  dart-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Test packages
        run: |
          for pkg in packages/*/; do
            (cd "$pkg" && dart test)
          done
